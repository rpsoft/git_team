services:
  postgres:
    restart: unless-stopped
    image: docker.io/library/postgres:16-alpine
    environment:
      POSTGRES_USER: gitteam
      POSTGRES_PASSWORD: gitteam
      POSTGRES_DB: gitteam
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init-gitea-db.sql:/docker-entrypoint-initdb.d/init-gitea-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gitteam"]
      interval: 5s
      retries: 20

  redis:
    restart: unless-stopped
    image: docker.io/library/redis:7-alpine
    volumes:
      - redisdata:/data

  gitea:
    restart: unless-stopped
    image: docker.io/gitea/gitea:1.26
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitteam
      GITEA__database__PASSWD: gitteam
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: ${GITEA_PUBLIC_URL:-http://localhost:3000}/
      GITEA__server__SSH_DOMAIN: localhost
      GITEA__server__SSH_PORT: "2222"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__webhook__ALLOWED_HOST_LIST: "*"
      GITEA__repository__DEFAULT_BRANCH: main
      GITEA__actions__ENABLED: "true"
      GITEA__actions__DEFAULT_ACTIONS_URL: github
    volumes:
      - giteadata:/data
    ports:
      - "3000:3000"
      - "2222:22"
    depends_on:
      postgres:
        condition: service_healthy

  backend:
    restart: unless-stopped
    build: ./backend
    env_file: .env
    environment: &backend_env
      DATABASE_URL: postgresql+asyncpg://gitteam:gitteam@postgres:5432/gitteam
      REDIS_URL: redis://redis:6379/0
      GITEA_URL: http://gitea:3000
      BACKEND_INTERNAL_URL: http://backend:8000
      TTS_URL: http://tts:8880
    volumes:
      - appdata:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      gitea:
        condition: service_started
    ports:
      - "8000:8000"

  worker:
    restart: unless-stopped
    build: ./backend
    # tini as PID 1 reaps orphaned child processes (git, test runners, browsers) agents leave behind.
    init: true
    pids_limit: 8192
    command: ["arq", "app.workers.main.WorkerSettings"]
    env_file: .env
    environment: *backend_env
    volumes:
      - appdata:/data
      - workspaces:/workspaces
    depends_on:
      - backend

  # Kokoro neural text-to-speech (natural agent voices in 1:1 calls). Internal only.
  tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    restart: unless-stopped

  # Gitea Actions runner: runs CI jobs (Node.js images by default) as sibling containers.
  # Registers itself with the token `make bootstrap` writes to .runner/token.
  runner:
    image: docker.io/gitea/act_runner:latest
    network_mode: host
    restart: unless-stopped
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://localhost:3000
      GITEA_RUNNER_REGISTRATION_TOKEN_FILE: /runner-token/token
      GITEA_RUNNER_NAME: studio-runner
    volumes:
      - ./runner/config.yaml:/config.yaml:ro
      - ./.runner:/runner-token:ro
      - runnerdata:/data
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
    depends_on:
      - gitea

  frontend:
    restart: unless-stopped
    build: ./frontend
    ports:
      - "8081:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
  giteadata:
  appdata:
  workspaces:
  runnerdata:
